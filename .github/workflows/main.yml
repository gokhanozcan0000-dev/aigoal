name: Cleanup Match Pages
 
on:
  workflow_dispatch:  # Manuel tetikleme — GitHub Actions sekmesinden "Run workflow" butonu
 
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Delete all -vs- HTML files
        run: |
          COUNT=$(ls *-vs-*.html 2>/dev/null | wc -l)
          echo "Silinecek dosya sayısı: $COUNT"
          ls *-vs-*.html 2>/dev/null || echo "Hiç dosya bulunamadı"
          rm -f *-vs-*.html
          echo "✓ Silme tamamlandı"
 
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: remove old match pages"
          git push
 
