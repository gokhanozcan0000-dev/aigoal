name: Cleanup Match Pages

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete weekly match HTML files (keep World Cup pages)
        run: |
          COUNT=0
          KEPT=0
          for f in *-vs-*.html; do
            [ -f "$f" ] || continue
            if grep -q "2026 FIFA World Cup" "$f" 2>/dev/null; then
              echo "Keeping WC page: $f"
              KEPT=$((KEPT + 1))
              continue
            fi
            rm "$f"
            COUNT=$((COUNT + 1))
          done
          echo "Deleted: $COUNT files"
          echo "Kept (World Cup): $KEPT files"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: remove old match pages"
          git push
